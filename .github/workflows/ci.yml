name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test, build (${{ matrix.os }})
    # Same-repo PRs already ran on push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx electron-vite build

  package:
    name: Package (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
            update_file: latest-mac.yml
          - os: windows-latest
            target: --win
            update_file: latest.yml
    runs-on: ${{ matrix.os }}
    env:
      # No signing in CI checks; release.yml signs when secrets exist.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx electron-vite build
      - name: Build installers (no publish)
        run: npx electron-builder --config electron-builder.config.cjs ${{ matrix.target }} --publish never
      - name: Check the auto-update manifest exists
        shell: bash
        run: |
          test -f "release/${{ matrix.update_file }}" || { echo "::error::release/${{ matrix.update_file }} missing"; ls release; exit 1; }
          cat "release/${{ matrix.update_file }}"
      - uses: actions/upload-artifact@v4
        with:
          name: bothub-${{ matrix.os }}
          retention-days: 3
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest*.yml
