name: Release

# Push a tag like v0.3.5 (matching package.json "version") to build and
# publish. Flow, designed so parallel jobs never race to create the release
# (the old 422 "already_exists" error):
#   1. prepare  – check the tag matches package.json, create a DRAFT release
#   2. build    – macOS and Windows upload into that draft (releaseType: draft)
#   3. publish  – once every file is there, flip the draft to published
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json $version"
            exit 1
          fi
      - name: Create draft release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # electron-builder (releaseType draft) silently skips a published
            # release, so a re-run would "succeed" without uploading anything.
            if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::release $TAG is already published; bump the version instead of re-running"
              exit 1
            fi
            echo "Draft release $TAG already exists; uploading into it."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "$TAG" --generate-notes
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build and upload to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Optional signing. Empty secrets → unsigned build.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [ -z "$WIN_CSC_LINK" ]; then unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; fi
          # electron-builder falls back to CSC_LINK on Windows: never sign the
          # .exe with the Apple certificate.
          if [ "$RUNNER_OS" = "Windows" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          npx electron-builder --config electron-builder.config.cjs ${{ matrix.target }} --publish always

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check every platform uploaded, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          echo "$assets"
          missing=0
          for pattern in 'latest-mac\.yml' 'latest\.yml' 'arm64\.dmg$' 'x64\.dmg$' 'arm64\.zip$' 'x64\.zip$' '\.exe$'; do
            if ! grep -Eq "$pattern" <<<"$assets"; then
              echo "::error::missing asset matching $pattern"
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
